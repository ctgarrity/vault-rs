[package]
name = "vault-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

[lints.rust]
# Keep unsafe code out unless we deliberately revisit this policy.
unsafe_code = "forbid"

[lints.clippy]
# Helpful, stable guidance without turning stylistic opinions into build failures.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Highlight common sources of crashes and incomplete code. These remain warnings
# so an intentional use does not block development.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
string_slice = "warn"
panic = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
dbg_macro = "warn"
